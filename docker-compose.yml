version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot_pass
      POSTGRES_DB: cryptobot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot -d cryptobot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  crypto-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_bot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:cryptobot_pass@postgres:5432/cryptobot_db
      LOG_LEVEL: INFO
    env_file:
      - .env

volumes:
  postgres_data:
