services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot_pass
      POSTGRES_DB: cryptobot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptobot -d cryptobot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  crypto-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_bot_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:cryptobot_pass@postgres:5432/cryptobot_db
      LOG_LEVEL: INFO
    env_file:
      - ${ENV_FILE:-./backend/.env}
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      crypto-bot:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: crypto_bot_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - crypto-bot
      - frontend

volumes:
  postgres_data:
