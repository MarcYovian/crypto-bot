version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot_pass
      POSTGRES_DB: cryptobot_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  crypto-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_bot_app
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptobot:cryptobot_pass@postgres:5432/cryptobot_db
      BINANCE_TESTNET: "True"
    env_file:
      - .env

volumes:
  postgres_data:
