services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptobot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptobot_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cryptobot_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptobot} -d ${POSTGRES_DB:-cryptobot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  crypto-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_bot_app
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cryptobot}:${POSTGRES_PASSWORD:-cryptobot_pass}@postgres:5432/${POSTGRES_DB:-cryptobot_db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - .:/app
      - ./logs:/var/log/cryptobot
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:

