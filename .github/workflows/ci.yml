name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # 1. TYPECHECK (Python 3.12, Mypy)
  # =========================================================================
  typecheck:
    name: Backend Static Type Checking (Mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy anyio

      - name: Run Static Type Checking (Mypy)
        run: |
          mypy --explicit-package-bases --ignore-missing-imports src/ main.py

  # =========================================================================
  # 2. TEST (Python 3.12, Pytest with Coverage)
  # =========================================================================
  test:
    name: Backend Test Suite with Coverage (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov anyio

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Backend Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # =========================================================================
  # 3. DOCKER BUILD & GHCR PUBLISH
  # =========================================================================
  docker:
    name: Backend Docker Image Build & GHCR Publish
    runs-on: ubuntu-latest
    needs: [typecheck, test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Lowercase Image Name
        id: image_meta
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_OWNER}/crypto-bot-backend" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image_meta.outputs.image }}:${{ github.sha }}
            ${{ steps.image_meta.outputs.image }}:latest

      - name: Validate Docker Compose Configurations
        run: |
          cp .env.example .env
          docker compose config
          docker compose -f docker-compose.prod.yml config

