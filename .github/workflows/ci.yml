name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Linting & Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run Type Checking (Mypy)
        run: |
          PYTHONPATH=backend mypy --explicit-package-bases --ignore-missing-imports backend/src/

  test-suite:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          PYTHONPATH=backend pytest backend/tests/ --cov=backend/src --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage Report (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: crypto-bot:latest
