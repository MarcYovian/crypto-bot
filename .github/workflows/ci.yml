name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # 1. BACKEND CI (Python 3.12, Mypy, Pytest)
  # =========================================================================
  backend-ci:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install mypy pytest pytest-cov anyio

      - name: Run Static Type Checking (Mypy)
        working-directory: ./backend
        run: |
          mypy --explicit-package-bases --ignore-missing-imports src/ main.py

      - name: Run Backend Pytest Suite with Coverage
        working-directory: ./backend
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Backend Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          if-no-files-found: ignore

  # =========================================================================
  # 2. FRONTEND CI (Node.js 20 LTS, ESLint, TypeScript Build, Vitest)
  # =========================================================================
  frontend-ci:
    name: Frontend Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript Compile & Vite Build
        working-directory: ./frontend
        run: npm run build

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: npm test

  # =========================================================================
  # 3. DOCKER IMAGES & COMPOSE BUILD VERIFICATION
  # =========================================================================
  docker-build:
    name: Multi-Container Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: crypto-bot-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: crypto-bot-frontend:test

      - name: Validate Docker Compose Configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose config
